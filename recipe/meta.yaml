{% set name = "speedcopy" %}
{% set version = "2.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/speedcopy-{{ version }}.tar.gz
  sha256: 71a1aaa6d8d387bbe737525f6680d58d9376e2b0c0aa5aab85cdcfbde9ec921a

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - setuptools

test:
  imports:
    - speedcopy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/antirotor/speedcopy
  summary: Replacement or alternative for python copyfile() utilizing server side copy on network shares for faster copying.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - maresb
